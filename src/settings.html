<!doctype html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Настройки - IlLegacy</title>
    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script type="module" src="/modules/settings.js" defer></script>
</head>

<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">IlLegacy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" role="button">← Назад к редактору</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="settings-container">
        <div class="settings-content">
            <h1 class="settings-title">Настройки</h1>

            <div class="settings-section">
                <h2 class="section-title">Внешний вид</h2>

                <div class="setting-item">
                    <div class="setting-info">
                        <label class="setting-label" for="theme-select">Тема оформления</label>
                        <p class="setting-description">Выберите светлую или тёмную тему интерфейса</p>
                    </div>
                    <div class="setting-control">
                        <select id="theme-select" class="form-select">
                            <option value="dark">Тёмная</option>
                            <option value="light">Светлая</option>
                            <option value="auto">Системная</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h2 class="section-title">Интеграции</h2>

                <div class="setting-item disabled">
                    <div class="setting-info">
                        <label class="setting-label">Локальный LLM</label>
                        <p class="setting-description">Использование локальной языковой модели для улучшения транспиляции</p>
                    </div>
                    <div class="setting-control">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="llm-toggle" disabled>
                            <label class="form-check-label" for="llm-toggle">
                                <span class="badge bg-secondary ms-2">Скоро</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
