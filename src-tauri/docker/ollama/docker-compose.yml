version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: illegacy-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Если нет GPU, закомментируйте секцию deploy выше и раскомментируйте строку ниже
    deploy: {}

volumes:
  ollama_data:
